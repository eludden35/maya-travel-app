<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#faf7f2;color:#1a1714;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="font-family:Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#5a4f3f;padding-bottom:16px;">
          Jettison
        </td>
      </tr>
      <tr>
        <td style="font-size:24px;line-height:1.3;padding-bottom:12px;">
          Your sign-in code
        </td>
      </tr>
      <tr>
        <td style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#2b2620;padding-bottom:20px;">
          Enter this code on the sign-in screen. It expires in an hour.
        </td>
      </tr>
      <tr>
        <td style="font-family:Menlo,Consolas,monospace;font-size:36px;letter-spacing:0.3em;color:#1a1714;padding-bottom:24px;">
          {{ .Token }}
        </td>
      </tr>
      <tr>
        <td style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#2b2620;padding-bottom:24px;">
          Or <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="color:#1a1714;">sign in with this link</a>.
        </td>
      </tr>
      <tr>
        <td style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#5a4f3f;">
          If you didn't ask to sign in to Jettison, you can ignore this email.
        </td>
      </tr>
    </table>
  </body>
</html>
