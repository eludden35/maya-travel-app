name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Services the tests don't need; skipping them makes `supabase start` faster.
  SUPABASE_EXCLUDE: edge-runtime,logflare,vector,imgproxy,realtime,studio

jobs:
  app:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:secrets

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - run: supabase test db

  e2e:
    name: End-to-end smoke (mobile Chromium)
    runs-on: ubuntu-latest
    needs: app
    env:
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Point the app at the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  migrate-uat:
    name: Apply migrations to UAT
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, database, e2e]
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in GitHub settings to
    # approve each push by hand.
    environment: uat
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: siaygwtwgvgjoircgpoa
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - name: Skip until the UAT secrets exist
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; skipping the UAT migration push."
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push
